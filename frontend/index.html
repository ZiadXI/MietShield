<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MietShield – German Tenant Lease Analyzer</title>
  <meta name="description" content="MietShield is an AI-powered German tenant law assistant that analyzes your lease for red flags and answers your tenancy questions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- ========== SIDEBAR ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">🛡️</span>
        <span class="logo-text">MietShield</span>
      </div>
    </div>

    <button class="btn-new-chat" id="btn-new-chat" onclick="startNewChat()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg>
      New Chat
    </button>

    <nav class="chat-history" id="chat-history">
      <p class="history-label">Recent Sessions</p>
    </nav>

    <div class="sidebar-footer">
      <p>AI Legal Assistant</p>
      <p class="disclaimer">Not a substitute for legal counsel.</p>
    </div>
  </aside>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="main-content" id="main-content">

    <!-- TOP NAV -->
    <header class="topbar">
      <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="Toggle Sidebar">☰</button>
      <h1 class="topbar-title">MietShield</h1>
      <div class="session-badge" id="session-badge">
        <span class="dot" id="status-dot"></span>
        <span id="session-label">No session</span>
      </div>
    </header>

    <!-- CHAT WINDOW -->
    <div class="chat-window" id="chat-window">
      <!-- Messages rendered here -->
    </div>

    <!-- INPUT AREA -->
    <div class="input-area-wrapper">
      <div class="chat-input-container">
        
        <!-- Attachment Preview -->
        <div id="attachment-preview" class="attachment-preview hidden">
          <div class="attachment-file">
            <span class="attachment-icon">📄</span>
            <span id="attachment-name" class="attachment-name">lease.pdf</span>
            <button type="button" class="btn-remove-attachment" onclick="clearAttachment()">✕</button>
          </div>
        </div>

        <form class="chat-input-form" id="chat-form" onsubmit="sendMessage(event)">
          <button type="button" class="btn-attach" onclick="document.getElementById('file-input').click()" title="Attach Lease PDF">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>
          <input type="file" id="file-input" accept=".pdf" hidden onchange="handleFileSelect(event)" />
          
          <input
            type="text"
            id="chat-input"
            class="chat-input"
            placeholder="Message MietShield or attach a lease..."
            autocomplete="off"
          />
          <button type="submit" class="btn-send" id="btn-send">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </form>
      </div>
      <p class="input-disclaimer">MietShield AI can make mistakes. Always verify important legal information.</p>
    </div>

  </main>

  <!-- ========== RENAME MODAL ========== -->
  <div class="modal-overlay hidden" id="rename-modal">
    <div class="modal-content">
      <h3 class="modal-title">Rename Chat</h3>
      <input type="text" id="rename-input" class="modal-input" placeholder="Enter new chat name" autocomplete="off" />
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeRenameModal()">Cancel</button>
        <button class="btn-save" id="btn-save-rename">Save</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
